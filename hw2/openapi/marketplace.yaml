openapi: 3.0.3
info:
  title: "Marketplace API: ДЗ 2"
  version: 2.0.0
  description: "API для товаров, заказов, промокодов и входа по JWT. Права зависят от роли: USER, SELLER или ADMIN. Запросы и ответы описаны в этом контракте; код моделей и HTTP-обработчиков создаёт OpenAPI Generator. Ошибки возвращаются в формате ErrorResponse, неверные входные данные дают HTTP 400. Суммы указываются с точностью до копейки. В каждом ответе есть идентификатор запроса X-Request-Id."
servers:
- url: http://localhost:8000
security:
- bearerAuth: []
tags:
- name: Health
- name: Auth
- name: Products
- name: Orders
- name: PromoCodes
paths:
  /health:
    get:
      tags:
      - Health
      operationId: health
      summary: "Проверить работу сервиса"
      description: "Проверяет, что сервис может обратиться к PostgreSQL."
      responses:
        '200':
          description: "Сервис и база данных доступны."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: "Зарегистрироваться"
      description: "Можно зарегистрироваться как покупатель (USER) или продавец (SELLER). Администратор (ADMIN) создаётся локальной командой."
      responses:
        '201':
          description: "Пользователь создан."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: "Войти"
      description: "После проверки пароля выдаёт access-токен на 20 минут и refresh-токен на 14 дней."
      responses:
        '200':
          description: "Выдана пара токенов."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refresh
      summary: "Обновить токены"
      description: "Обменивает refresh на новую пару токенов. После успешного обмена старый refresh больше не работает."
      responses:
        '200':
          description: "Выдана новая пара токенов."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /products:
    post:
      tags:
      - Products
      operationId: create_product
      summary: "Создать товар"
      description: "Продавец (SELLER) создаёт товар от своего имени. Администратор (ADMIN) может указать в seller_id другого продавца. Покупателю (USER) операция недоступна."
      responses:
        '201':
          description: "Товар создан."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
    get:
      tags:
      - Products
      operationId: list_products
      summary: "Посмотреть список товаров"
      description: "Доступно всем трём ролям. В список попадают и архивные товары (ARCHIVED). Можно одновременно отобрать товары по статусу и категории; категория должна совпадать точно. Товары отсортированы по created_at, затем по id."
      responses:
        '200':
          description: "Список товаров с общим количеством и параметрами страницы."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: category
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
  /products/{id}:
    get:
      tags:
      - Products
      operationId: get_product
      summary: "Посмотреть товар"
      description: "Покупатель, продавец и администратор могут получить любой товар по его ID."
      responses:
        '200':
          description: "Товар найден."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
      - Products
      operationId: update_product
      summary: "Обновить товар целиком"
      description: "Продавец меняет только свои товары, администратор может менять любые. Нужно передать все обязательные поля. Если description не передано, описание станет null. Новая цена не меняет цены в уже созданных заказах."
      responses:
        '200':
          description: "Товар обновлён."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
      - Products
      operationId: archive_product
      summary: "Убрать товар в архив"
      description: "Продавец архивирует только свои товары, администратор может архивировать любые. Запись остаётся в базе со статусом ARCHIVED. Повторный запрос тоже завершается успешно."
      responses:
        '204':
          description: "Товар в архиве. Тело ответа пустое."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /orders:
    post:
      tags:
      - Orders
      operationId: create_order
      summary: "Оформить заказ"
      description: "Доступно USER и ADMIN. Сервер по порядку проверяет частоту операций, наличие активного заказа, товары, остатки и промокод. Резерв товара, цены, заказ и запись об операции сохраняются вместе, в одной транзакции. Один product_id нельзя передать дважды. Максимальный total_amount: 999999999.99."
      responses:
        '201':
          description: "Заказ создан, товары зарезервированы."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
  /orders/{id}:
    get:
      tags:
      - Orders
      operationId: get_order
      summary: "Посмотреть заказ"
      description: "Покупатель (USER) видит только свои заказы, администратор (ADMIN) видит любые. Для продавца (SELLER) операция недоступна."
      responses:
        '200':
          description: "Заказ найден."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
      - Orders
      operationId: update_order
      summary: "Изменить состав заказа"
      description: "Покупатель меняет свой заказ, администратор может менять любой. Заказ должен быть в статусе CREATED. После проверки владельца и статуса сервер проверяет частоту UPDATE_ORDER. Старый резерв возвращается, новый резерв и текущие цены сохраняются в одной транзакции. Если сумма стала меньше min_order_amount, промокод снимается, а счётчик его использований уменьшается. Истёкший или отключённый промокод даёт PROMO_CODE_INVALID: обновление целиком откатывается. Промокод не расходуется второй раз."
      responses:
        '200':
          description: "Позиции, остатки и сумма заказа обновлены."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /orders/{id}/cancel:
    post:
      tags:
      - Orders
      operationId: cancel_order
      summary: "Отменить заказ"
      description: "Покупатель отменяет свой заказ, администратор может отменить любой. Отмена доступна в CREATED и PAYMENT_PENDING. Сервер возвращает товары в остаток и уменьшает счётчик использований промокода в одной транзакции. Повторная отмена вернёт INVALID_STATE_TRANSITION."
      responses:
        '200':
          description: "Заказ отменён, товары возвращены в остаток."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /orders/{id}/status:
    post:
      tags:
      - Orders
      operationId: change_order_status
      summary: "Изменить статус заказа"
      description: "Доступно только ADMIN. Статусы меняются по порядку: CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED. Для отмены есть отдельный запрос /cancel. Эта операция нужна, чтобы показать переходы статусов без подключения платёжного провайдера."
      responses:
        '200':
          description: "Статус заказа изменён."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /promo-codes:
    post:
      tags:
      - PromoCodes
      operationId: create_promo_code
      summary: "Создать промокод"
      description: "Доступно SELLER и ADMIN. Дата начала valid_from должна быть не позже valid_until. В датах нужен часовой пояс. Процент скидки не может быть больше 100; в денежных значениях допускается до двух знаков после запятой."
      responses:
        '201':
          description: "Промокод создан."
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Передайте access-токен с ID пользователя (sub) и его ролью (role). Refresh-токен для доступа к операциям не подходит."
  schemas:
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    DiscountType:
      type: string
      enum:
      - PERCENTAGE
      - FIXED_AMOUNT
    Role:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    RegistrationRole:
      type: string
      enum:
      - USER
      - SELLER
    ErrorCode:
      type: string
      enum:
      - PRODUCT_NOT_FOUND
      - PRODUCT_INACTIVE
      - ORDER_NOT_FOUND
      - ORDER_LIMIT_EXCEEDED
      - ORDER_HAS_ACTIVE
      - INVALID_STATE_TRANSITION
      - INSUFFICIENT_STOCK
      - PROMO_CODE_INVALID
      - PROMO_CODE_MIN_AMOUNT
      - ORDER_OWNERSHIP_VIOLATION
      - VALIDATION_ERROR
      - TOKEN_EXPIRED
      - TOKEN_INVALID
      - REFRESH_TOKEN_INVALID
      - ACCESS_DENIED
      - USER_ALREADY_EXISTS
      - CREDENTIALS_INVALID
      - HTTP_ERROR
      - INTERNAL_ERROR
    ProductCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 999999999.99
          multipleOf: 0.01
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          description: "ID владельца товара. Продавец может указать только себя; администратор может выбрать существующего пользователя с ролью SELLER или ADMIN. Если поле не передано, владельцем станет текущий пользователь."
    ProductUpdate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 999999999.99
          multipleOf: 0.01
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          description: "ID владельца товара. Продавец может указать только себя; администратор может выбрать существующего пользователя с ролью SELLER или ADMIN. Если поле не передано, владелец не изменится."
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 999999999.99
          multipleOf: 0.01
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          description: "ID пользователя, которому принадлежит товар."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalElements
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Za-z0-9_]+$
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        role:
          $ref: '#/components/schemas/RegistrationRole'
          default: USER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Za-z0-9_]+$
