name: soa

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20

  flyway:
    image: redgate/flyway:11.20.0
    platform: linux/amd64
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/marketplace
      FLYWAY_USER: marketplace
      FLYWAY_PASSWORD: marketplace
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8001"
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env}
      ORDER_LIMIT_MINUTES: ${ORDER_LIMIT_MINUTES:-1}
    depends_on:
      flyway:
        condition: service_completed_successfully

volumes:
  postgres_data:
