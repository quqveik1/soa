apiVersion: 1

datasources:
  - name: ClickHouse
    uid: cinema-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      protocol: http
      port: 8123
      defaultDatabase: cinema
      username: grafana
    secureJsonData:
      password: grafana
