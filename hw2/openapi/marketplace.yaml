          schema:
            type: string
            format: uuid
          description: "Уникальный ID запроса (UUID), который создал сервер."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: "Товар (PRODUCT_NOT_FOUND) или заказ (ORDER_NOT_FOUND) не найден."
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: "Уникальный ID запроса (UUID), который создал сервер."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: "Операция противоречит текущим данным. Возможные коды: PRODUCT_INACTIVE, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION, INSUFFICIENT_STOCK, USER_ALREADY_EXISTS. Если товаров не хватает, в details.products указаны product_id, запрошенное количество requested_quantity и доступный остаток available_stock."
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: "Уникальный ID запроса (UUID), который создал сервер."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: "Промокод недействителен (PROMO_CODE_INVALID) или сумма заказа меньше его минимума (PROMO_CODE_MIN_AMOUNT)."
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: "Уникальный ID запроса (UUID), который создал сервер."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: "Операция выполнена слишком часто: ORDER_LIMIT_EXCEEDED. Между успешными операциями одного типа у одного пользователя должен пройти интервал ORDER_LIMIT_MINUTES."
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: "Уникальный ID запроса (UUID), который создал сервер."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: "Внутренняя ошибка сервера: INTERNAL_ERROR. Служебные подробности в ответ не попадают."
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: "Уникальный ID запроса (UUID), который создал сервер."
