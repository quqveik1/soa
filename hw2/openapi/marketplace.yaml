  responses:
    BadRequest:
      description: "Неверные входные данные: VALIDATION_ERROR. Для ошибок полей в details.fields указаны поле (field) и сообщение (message). Ошибки проверки схемы также содержат тип нарушения (type)."
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: "Уникальный ID запроса (UUID), который создал сервер."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: "Не удалось войти или проверить токен. Возможные коды: TOKEN_INVALID, TOKEN_EXPIRED, REFRESH_TOKEN_INVALID, CREDENTIALS_INVALID."
